# Platform-native CI/CD — luxfi/kms
#
# BUILD IS NOT DECLARED HERE. ghcr.io/luxfi/kms is built and pushed by
# .hanzo/workflows/release.yml on the native forge runners (git.hanzo.ai ->
# git-runner, pool `lux-build-linux-amd64`). That workflow smokes the image
# against /healthz before a manifest exists and proves the pushed tag resolves
# after, and it is the only thing that publishes this image.
#
# ONE publisher per image. An `images:` block here would put a second, ungated
# build on the same `vX.Y.Z` tag from the same commit — two producers racing one
# name, and the one that wins is whichever finishes last. The platform lane
# yields to a repo's own `.hanzo/workflows/cicd.yml`; release.yml is a workflow
# of its own, so the yield is spelled by declaring no build.
#
# Schema: ~/work/hanzo/platform/docs/PLATFORM_CI.md §hanzo.yml.
#
# No `deploy:` block either. The kms Deployment in the hanzo namespace is
# kustomize-managed and carries no operator CR, so there is nothing here for the
# Service-CR rollout to target. Rolling the image stays a separate, explicit step.
