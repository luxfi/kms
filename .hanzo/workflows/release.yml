name: Release
# Builds ghcr.io/luxfi/kms on the native runners (git.hanzo.ai → git-runner).
# A tag push vX.Y.Z is a release: the image carries the semver tags plus the
# sha tag; a main push carries only the sha tag. The image must pass the smoke
# below before it is allowed to exist at the registry, and the pushed manifest
# is proven resolvable so a CR pin can never point at a phantom tag.
#
# amd64 and arm64, one job each on its own native pool: the lab runs both, and a
# single-arch tag deploys on half of it. Neither arch is emulated, so the binary
# that ships for an arch was compiled AND smoke-tested on that arch. The smoke is
# also why this is a fan-out rather than one two-platform build — `--load` takes
# a single image into the local daemon and refuses a manifest list, so a job that
# tests what it built can only build one platform. Each job publishes its own
# per-arch name; the merge job joins them under the release names, which are the
# only names anything deploys.
#
# ghcr auth: GHCR_USER / GHCR_TOKEN — org Actions secrets on this forge,
# sourced from KMS (luxfi:/registry/ghcr-user, ghcr-token, env=prod). The
# instance GITHUB_TOKEN is a Hanzo Git token and is NOT valid at ghcr.io or
# github.com; the same PAT also serves the Dockerfile's module fetch.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            pool: lux-build-linux-amd64
          - arch: arm64
            pool: lux-build-linux-arm64
    runs-on: ['${{ matrix.pool }}']
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Compute this arch's image name
        id: meta
        # A per-arch name, never a release name. A release name that resolves to
        # one architecture is worse than one that does not exist yet: it pulls
        # on that arch and fails everywhere else. Only merge writes those names.
        run: |
          set -euo pipefail
          echo "image=ghcr.io/luxfi/kms:sha-${GITHUB_SHA:0:7}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: network=host

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build ${{ matrix.arch }} (load for smoke, not yet pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            GITHUB_TOKEN=${{ secrets.GHCR_TOKEN }}
          load: true
          push: false
          provenance: false
          tags: ${{ steps.meta.outputs.image }}

      - name: Smoke — the binary is present and serves
        # An image that builds but cannot answer /healthz deploys and half-works;
        # catch it before a manifest exists rather than after one ships.
        run: |
          set -euo pipefail
          img="${{ steps.meta.outputs.image }}"
          docker run --rm --entrypoint sh "$img" -c 'command -v kms'
          # kms REFUSES TO SERVE without an at-rest key, by design —
          # pkg/atrest: "Callers translate it into a refusal to serve; nothing may
          # treat it as 'encryption off'." So the smoke container needs one, and
          # without it every release since at least six commits ago died on
          #   kms: KMS_ENCRYPTION_KEY_B64 is empty: no at-rest encryption key configured
          #   ::error::kms never answered /healthz
          # which reads as a broken binary and is the security posture working.
          #
          # Generated per run and never stored: 32 random bytes for a container
          # that is destroyed seconds later. It encrypts nothing that outlives the
          # probe, so it is not a secret and does not belong in KMS.
          key="$(head -c 32 /dev/urandom | base64 -w0 2>/dev/null || head -c 32 /dev/urandom | base64)"
          # KMS_HOME_ORG is the second startup gate, and equally deliberate:
          #   "the secret store belongs to the org that owns this deployment …
          #    Without it the secret surface would authorize any valid IAM token
          #    from any org"
          # A smoke probe needs a value, not the right value; nothing is stored.
          cid=$(docker run -d \
            -e KMS_ENCRYPTION_KEY_B64="$key" \
            -e KMS_HOME_ORG=smoke \
            "$img")
          for i in $(seq 1 15); do
            if docker exec "$cid" curl -sf http://localhost:8080/healthz >/dev/null 2>&1; then
              echo "healthz ok"; docker rm -f "$cid"; exit 0
            fi
            sleep 2
          done
          docker logs "$cid" | tail -40; docker rm -f "$cid"
          echo "::error::kms never answered /healthz"; exit 1

      - name: Push this arch
        run: docker push '${{ steps.meta.outputs.image }}'

      - name: Verify this arch's pushed image resolves
        run: |
          set -euo pipefail
          img="${{ steps.meta.outputs.image }}"
          for i in 1 2 3 4 5 6; do
            if docker manifest inspect "$img" >/dev/null 2>&1; then
              echo "$img is resolvable"; exit 0
            fi
            echo "manifest not visible yet (attempt ${i}/6) — retrying"; sleep 5
          done
          echo "::error::$img not pullable after push"; exit 1

  merge:
    needs: build
    # Registry-side only: imagetools reads the two per-arch manifests and writes
    # a list pointing at both. No builder and no platform of its own, so which
    # pool runs this does not matter.
    runs-on: [lux-build-linux-amd64]
    timeout-minutes: 15
    steps:
      - name: Compute the release names
        id: meta
        run: |
          set -euo pipefail
          SHA_TAG="ghcr.io/luxfi/kms:sha-${GITHUB_SHA:0:7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            {
              echo "tags<<EOF"
              echo "ghcr.io/luxfi/kms:v${VERSION}"
              echo "ghcr.io/luxfi/kms:${VERSION}"
              echo "$SHA_TAG"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "$SHA_TAG"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Join both architectures under every release name
        # imagetools, not `docker manifest create`: buildx pushes a per-arch OCI
        # index and `docker manifest create` rejects those outright.
        run: |
          set -euo pipefail
          base="ghcr.io/luxfi/kms:sha-${GITHUB_SHA:0:7}"
          args=''
          while IFS= read -r t; do
            [ -n "$t" ] && args="$args -t $t"
          done <<< "${{ steps.meta.outputs.tags }}"
          # shellcheck disable=SC2086
          docker buildx imagetools create $args "${base}-amd64" "${base}-arm64"

      - name: Prove every release name carries BOTH architectures
        # A one-entry manifest list pulls fine on the arch that built it and
        # fails everywhere else — the exact state this fan-out replaces. Counting
        # the platforms is what makes "multi-arch" a fact rather than a hope.
        run: |
          set -euo pipefail
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            got=$(docker buildx imagetools inspect "$t" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
            echo "$t -> ${got}"
            for want in linux/amd64 linux/arm64; do
              case " $got " in
                *" $want "*) ;;
                *) echo "::error::$t does not carry $want"; exit 1 ;;
              esac
            done
          done <<< "${{ steps.meta.outputs.tags }}"
